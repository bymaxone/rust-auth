name: mutation-sweep

# The full-workspace mutation sweep, split into shards. The per-push gate in `ci.yml` mutates
# only what a push changed; this is the whole-workspace measurement behind the release floor
# of zero missed mutants. A full sweep is ~3000 mutants and does not fit one job's limit, so
# `cargo mutants --shard k/n` (https://mutants.rs/shards.html) divides it across a matrix.
# Manual only: it is a measurement taken on demand, not a check on every change.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to sweep. Defaults to the ref the run was dispatched on.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      timeout: ${{ steps.plan.outputs.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
      - name: Plan the shards, and refuse a plan that cannot finish
        id: plan
        env:
          # The three constants that decide the layout. A shard job takes its time limit from
          # here, so the budget below is computed from the limit the job actually runs under.
          SHARDS: '48'
          TIMEOUT_MINUTES: '240'
          # Measured: shards of ~124 mutants did not finish in 240 minutes. A mutant costs up to
          # ~2.5 minutes to build and test, so 150 seconds each is the budget, unviable
          # mutants (which are quick) included as a margin.
          SECONDS_PER_MUTANT: '150'
        run: |
          set -euo pipefail
          total="$(cargo mutants --list | grep -c .)"
          budget=$(( TIMEOUT_MINUTES * 60 / SECONDS_PER_MUTANT ))
          # cargo-mutants deals mutants out round-robin, so the fullest shard holds the ceiling.
          per_shard=$(( (total + SHARDS - 1) / SHARDS ))
          needed=$(( (total + budget - 1) / budget ))
          echo "mutants: ${total}; shards: ${SHARDS}; fullest shard: ${per_shard}; budget per shard: ${budget} (${TIMEOUT_MINUTES} min at ${SECONDS_PER_MUTANT} s)"
          if [ "${per_shard}" -gt "${budget}" ]; then
            echo "::error::${per_shard} mutants per shard exceed the budget of ${budget} that fits ${TIMEOUT_MINUTES} minutes; set SHARDS to at least ${needed}"
            exit 1
          fi
          {
            echo "matrix=$(seq 0 $(( SHARDS - 1 )) | jq -cs .)"
            echo "shards=${SHARDS}"
            echo "timeout=${TIMEOUT_MINUTES}"
          } >> "$GITHUB_OUTPUT"

  shard:
    name: shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
    needs: plan
    runs-on: ubuntu-latest
    # The limit comes from `plan`, which refuses a layout whose shards cannot fit in it, so a
    # slow runner can still be cancelled but growth in the mutant count cannot truncate a shard
    # unnoticed. It also keeps a hang from holding a runner for the 6-hour platform default.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants numbers shards from 0.
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutate this shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        # `cap_lints` and `--all-features` come from .cargo/mutants.toml, as in ci.yml, so a
        # replaced body is tested instead of failing to compile under `-D warnings`. That
        # setting also removes rustc's const-eval hang detection, hence `--build-timeout`
        # (the config offers only the multiplier form, which `--in-place` refuses).
        # The exit status is kept so the artifacts upload before the job reports it.
        run: |
          set +e
          assigned="$(cargo mutants --list --shard "${SHARD}/${SHARDS}" | grep -c .)"
          cargo mutants --in-place --build-timeout 300 --shard "${SHARD}/${SHARDS}"
          status=$?
          echo "cargo-mutants exit status: ${status}"
          echo "${status}" > mutants.out/exit-status
          # What this shard was dealt, to compare with what it tested (the summary does).
          echo "${assigned}" > mutants.out/assigned
          {
            echo "### Shard ${SHARD}/${SHARDS} (exit ${status}, ${assigned} assigned)"
            jq -r '"total \(.total_mutants) · caught \(.caught) · missed \(.missed) · timeout \(.timeout) · unviable \(.unviable)"' mutants.out/outcomes.json
          } >> "$GITHUB_STEP_SUMMARY"
          # Exit 3 means only timeouts: a mutant that makes the suite hang is detected, since
          # a test run that never finishes is not a passing one. Listed in the summary, not failed.
          if [ "${status}" -eq 3 ]; then
            exit 0
          fi
          exit "${status}"
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 30
          if-no-files-found: warn

  summary:
    name: summary
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-shard-*
          path: shards
      - name: Totals, and fail on any missed or untested mutant
        env:
          SHARDS: ${{ needs.plan.outputs.shards }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          incomplete=0
          # A plan that refused the layout, or a shard job that was cancelled, is an incomplete
          # sweep whatever the artifacts say.
          if [ "${PLAN_RESULT}" != "success" ]; then
            echo "::error::the plan job ended ${PLAN_RESULT}: no layout was approved"
            incomplete=1
          fi
          if [ "${SHARD_RESULT}" = "cancelled" ]; then
            echo "::error::at least one shard job was cancelled; the sweep is incomplete"
            incomplete=1
          fi
          files=(shards/*/outcomes.json)
          echo "shards reporting: ${#files[@]} of ${SHARDS:-?}"
          if [ -z "${SHARDS}" ] || [ "${#files[@]}" -ne "${SHARDS}" ]; then
            echo "::error::only ${#files[@]} of ${SHARDS:-?} shards produced results; the sweep is incomplete"
            incomplete=1
          fi
          # cargo-mutants rewrites outcomes.json as it goes, so a shard cancelled at the job
          # limit or lost with its runner still uploads a partial file. The exit-status file
          # is written only after cargo-mutants returns, so its absence marks that shard.
          for f in "${files[@]}"; do
            d="$(dirname "$f")"
            if [ ! -s "$d/exit-status" ]; then
              echo "::error::$(basename "$d") did not run to completion (no exit status recorded)"
              incomplete=1
            fi
            # A shard that ended normally can still have stopped early. It must account for
            # every mutant it was dealt: tested = caught + missed + timeout + unviable (+ any
            # that passed), against the count `cargo mutants --list` gave for the shard.
            assigned="$(cat "$d/assigned" 2>/dev/null || true)"
            tested="$(jq '.caught + .missed + .timeout + .unviable + .success' "$f")"
            if [ -z "${assigned}" ]; then
              echo "::error::$(basename "$d") recorded no assigned count"
              incomplete=1
            elif [ "${tested}" -ne "${assigned}" ]; then
              echo "::error::$(basename "$d") tested ${tested} of ${assigned} assigned mutants"
              incomplete=1
            fi
          done
          {
            echo "### Mutation sweep"
            echo
            echo "| shard | total | caught | missed | timeout | unviable |"
            echo "|---|---|---|---|---|---|"
            for f in "${files[@]}"; do
              jq -r --arg s "$(basename "$(dirname "$f")")" \
                '"| \($s) | \(.total_mutants) | \(.caught) | \(.missed) | \(.timeout) | \(.unviable) |"' "$f"
            done
            jq -s -r '"| **all** | \(map(.total_mutants)|add) | \(map(.caught)|add) | \(map(.missed)|add) | \(map(.timeout)|add) | \(map(.unviable)|add) |"' "${files[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          missed=0
          for f in shards/*/missed.txt; do
            if [ -s "$f" ]; then
              missed=1
              echo "::error::missed mutants in $(dirname "$f")"
              echo "#### Missed in $(dirname "$f" | xargs basename)" >> "$GITHUB_STEP_SUMMARY"
              { echo '```'; cat "$f"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          for f in shards/*/timeout.txt; do
            if [ -s "$f" ]; then
              { echo "#### Timed out in $(dirname "$f" | xargs basename)"; echo '```'; cat "$f"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$missed" -eq 0 ] && [ "$incomplete" -eq 0 ]
