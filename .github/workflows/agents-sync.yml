# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The rules that must not vary between Bymax repositories are
# edited there; everything this repository writes for itself lives outside the
# markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. That is
# why this is a sync and not a `uses:` — the reusable CI above it propagates by
# reference, this one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly, off the hour and clear of this repository's existing Monday cluster:
    # scorecard at 05:31 and both codeql and peer-advisory-drift at 06:17. The
    # dependency audit is daily at 04:23 and is not a factor. 07:17 leaves an hour
    # after the last of them.
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # Authentication is a GitHub App: the called workflow mints an installation
      # token per run, so the credential that reaches a run expires within the hour.
      # The App's private key behind AGENTS_SYNC_PRIVATE_KEY is long-lived and
      # installed org-wide with write access, so it carries a rotation requirement
      # of its own.
      #
      # Why an App and not the default GITHUB_TOKEN: a pull request opened with the
      # default token starts no workflow runs, and this repository's ruleset
      # (`rust-auth-pr-and-ci-gates`) requires status checks to pass, so such a
      # pull request cannot merge until somebody pushes to it. The default token is
      # also not permitted to create pull requests in this organisation at all.
      #
      # Both are organisation secrets visible to every repository, so this one reads
      # them with no configuration here. Named rather than passed with `inherit`, so
      # the called workflow receives these two and not every secret this repository
      # holds.
      #
      # Supply both or neither: the called workflow refuses a run where exactly one
      # is set. With neither it falls back to the default token and only warns,
      # which here means a sync pull request that starts none of its required checks.
      #
      # `sync-token`, also a declared input of the called workflow, is left unmapped:
      # no credential stands behind it in this organisation.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
