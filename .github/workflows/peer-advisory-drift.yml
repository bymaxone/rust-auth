# Audits the dependency ranges this package DECLARES, which is a different
# question from the one Dependabot answers. Dependabot looks at what is
# installed here — the lockfile, our own devDependencies — and stays quiet as
# long as that is current. It never looks at what consumers are told they can
# install: a `peerDependencies` floor below a published advisory says a
# vulnerable install is supported, and the consumer resolving that range is
# free to pick the low end.
#
# Scheduled rather than event-driven because the declared range never changes
# and becomes wrong anyway — the advisory database is what moves. A range that
# was clean when it was written starts admitting a vulnerable version the day a
# new advisory is published, with no commit and no alert to notice.
name: Peer Advisory Drift

on:
  schedule:
    # Weekly, Monday morning UTC. Off the hour: scheduled runs cluster at :00
    # and GitHub delays them under load.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Single-flight across the whole repository, deliberately NOT keyed by
# `github.ref` the way the other workflows here are. What two runs would race
# over is one tracking issue per repository, so a ref-scoped group would put a
# dispatch and a scheduled run in different groups and leave the race intact.
# Queue rather than cancel: interrupting a run midway through rewriting or
# closing that issue is worse than waiting for it.
concurrency:
  group: peer-advisory-drift
  cancel-in-progress: false

# `issues: write` lets the check file and close its own tracking issue.
# Permissions on a reusable workflow can only narrow what the caller grants, so
# this has to be declared here as well as there.
permissions:
  contents: read
  issues: write

jobs:
  drift:
    # `workflow_dispatch` can be fired from any branch. Auditing a branch's
    # unmerged manifest and writing the result to the repository-wide tracking
    # issue would report findings that do not describe what this package
    # actually declares.
    if: github.ref_name == github.event.repository.default_branch
    uses: bymaxone/.github/.github/workflows/peer-advisory-drift.yml@v1
    with:
      # The published npm surface lives in the workspace, not at the repository
      # root: the root package.json here is dev tooling for the Rust side and
      # declares no peer dependencies at all, so auditing it would pass on an
      # empty set and report nothing forever.
      manifest-path: packages/rust-auth/package.json
