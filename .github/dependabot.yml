version: 2
updates:
  # Rust dependencies (workspace Cargo.toml / committed Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions referenced by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # Node dev-tooling (husky / commitlint) from the root package.json + committed lockfile.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # The published npm package and its build/lint/docs dev-tooling.
  - package-ecosystem: npm
    directory: "/packages/rust-auth"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # react, react-dom and next are peer dependencies of one another and of this package,
      # and their type packages track react's version. Bumped one at a time, each PR moves a
      # dev-dependency out of the range its siblings still declare, so the install resolves to
      # a combination no consumer would ever have. They move together or not at all.
      react-next:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "@types/react"
          - "@types/react-dom"
          - "@testing-library/react"
