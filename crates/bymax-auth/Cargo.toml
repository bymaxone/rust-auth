[package]
name = "bymax-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Production-grade authentication and authorization — the single crates.io facade over the bymax-auth-* crates."

# Every feature forwards to the internal crate that implements it. They used to be empty
# placeholders "while the internal crates are still skeletons" — the crates stopped being
# skeletons and the bodies never caught up, so `bymax-auth/mfa` compiled the facade with MFA
# nominally on and `bymax-auth-core` with it OFF. No error, no warning: an operator who enables
# `mfa` or `platform` here believed the capability was compiled in and it was not, which for a
# second factor is worse than not offering the flag at all.
#
# There is deliberately no `core` feature — the engine is always compiled.
[features]
default = ["scrypt"]

# Password hashers — at least one is required (enforced by the `compile_error!` in lib.rs).
scrypt = ["bymax-auth-core/scrypt"]
argon2 = ["bymax-auth-core/argon2"]

# Optional engine flows.
sessions = ["bymax-auth-core/sessions", "bymax-auth-axum?/sessions"]
mfa = ["bymax-auth-core/mfa", "bymax-auth-axum?/mfa", "bymax-auth-redis?/mfa"]
oauth = ["bymax-auth-core/oauth", "bymax-auth-axum?/oauth", "bymax-auth-redis?/oauth"] # OAuth orchestration + traits; no HTTP client
oauth-reqwest = ["oauth", "bymax-auth-core/oauth-reqwest"] # adds the bundled ReqwestHttpClient
platform = ["bymax-auth-core/platform", "bymax-auth-axum?/platform", "bymax-auth-redis?/platform"]
invitations = ["bymax-auth-core/invitations", "bymax-auth-axum?/invitations"]
breach = ["bymax-auth-core/breach"]              # HIBP k-anonymity over the HttpClient seam
api-keys = ["bymax-auth-core/api-keys", "bymax-auth-axum?/api-keys"] # scoped service API keys; with `axum`, also the layer, extractor and flush task
openapi = ["bymax-auth-axum?/openapi"] # with `axum`, the OpenAPI request-body schemas of the auth routes

# Infrastructure / adapters. Each pulls its crate in as an optional dependency. The flow features
# above forward to the adapters that gate the same flow as weak dependency features (`adapter?/flow`),
# so enabling a flow never leaves an adapter selected without its half of it; the forwarding is
# checked by `tests/adapter_feature_forwarding.rs`.
redis = ["dep:bymax-auth-redis"]
axum = ["dep:bymax-auth-axum"]
client = ["dep:bymax-auth-client"]

# Convenience meta-feature: every capability on.
full = [
    "scrypt",
    "argon2",
    "sessions",
    "mfa",
    "oauth",
    "oauth-reqwest",
    "platform",
    "invitations",
    "breach",
    "api-keys",
    "openapi",
    "redis",
    "axum",
    "client",
]

# docs.rs renders the full public surface; `--cfg docsrs` enables the
# feature-gated doc annotations added to items as the crates gain content.
[package.metadata.docs.rs]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
bymax-auth-core = { path = "../bymax-auth-core", version = "0.0.0" }
bymax-auth-types = { path = "../bymax-auth-types", version = "0.0.0" }
bymax-auth-redis = { path = "../bymax-auth-redis", version = "0.0.0", optional = true }
bymax-auth-axum = { path = "../bymax-auth-axum", version = "0.0.0", optional = true }
bymax-auth-client = { path = "../bymax-auth-client", version = "0.0.0", optional = true }
