# cargo-audit configuration. `cargo audit` does not read `deny.toml`, so the scheduled audit
# (`.github/workflows/audit.yml`, which runs with `--deny warnings`) needs its own copy of every
# advisory exception. Keep this list identical to `[advisories] ignore` in `deny.toml`.

[advisories]
ignore = [
    # RUSTSEC-2026-0440: `astral-tokio-tar` is unmaintained and is reached only as a
    # dev-dependency through `testcontainers` (the container-backed integration tests):
    # `cargo tree -e normal -i astral-tokio-tar` prints no path, with or without `--target all`,
    # so no published crate depends on it. No maintained replacement exists and the latest
    # `testcontainers` still requires it. Remove this entry when `testcontainers` drops the crate.
    "RUSTSEC-2026-0440",
]
